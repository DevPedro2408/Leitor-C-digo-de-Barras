<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <link rel="stylesheet" href="style.css">
    <title>Sistema TechnoExpress</title>
</head>
<body>
    <header>
        <img src="assets/logoTecnoExpress.png" class="logo" alt="Logo">
        <h2>Estoque TechnoExpress</h2>
    </header>

    <div class="containerProduto">
        <h2 class="cadastro">Cadastro</h2>
        <label for="nomeProduto">Nome do Produto</label>
        <input type="text" id="nomeProduto" class="inputsProdutos">

        <label for="codigo">Código de Barras</label>
        <input type="text" id="codigo" class="inputsProdutos">

        <label for="Quantidade">Quantidade</label>
        <input type="number" id="Quantidade" class="inputsProdutos">

        <label for="">Preço</label>
        <input type="number" id="preco" class="inputsProdutos">

        <button type="button" id="botaoCadastrar" class="botaoCadastrar">Cadastrar</button>
    </div>

    <div class="containerCodigoBarras">
        <h2 class="tituloCodBarras">Leitor de Código de Barras</h2>
        <video id="camera" width="300" height="200"></video>
    </div>

    <table>
        <thead>
            <tr>
                <th></th>
                <th>Produto</th>
                <th>Código</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody id="adicionarProdutos">
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
